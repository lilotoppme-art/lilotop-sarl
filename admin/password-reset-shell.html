<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>{{PAGE_TITLE}} | LILOTOP SARL</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/nexus.css">
  <link rel="stylesheet" href="/admin/password-reset.css">
</head>
<body>
  <main class="password-reset-page">
    <section class="login-panel" aria-labelledby="reset-title">
      <img class="login-logo" src="/assets/logo-lilotop.svg" alt="LILOTOP SARL">
      <p class="eyebrow">Acces securise</p>
      <h1 id="reset-title">Recuperer l'acces NEXUS AI</h1>

      <form id="reset-request-form">
        <p class="login-copy">Recevez un lien personnel et temporaire sur l'adresse administrateur configuree.</p>
        <label for="reset-email">Adresse administrateur</label>
        <input id="reset-email" name="email" type="email" autocomplete="username" value="admin@lilotopsarl.com" required>
        <button class="button button-primary" type="submit">Envoyer le lien</button>
      </form>

      <form id="reset-complete-form" hidden>
        <p class="login-copy">Choisissez un mot de passe d'au moins 14 caracteres comprenant majuscule, minuscule, chiffre et symbole.</p>
        <label for="new-password">Nouveau mot de passe</label>
        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="14" required>
        <label for="confirm-password">Confirmer le mot de passe</label>
        <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="14" required>
        <button class="button button-primary" type="submit">Enregistrer le nouveau mot de passe</button>
      </form>

      <p class="form-status" id="reset-status" role="status" aria-live="polite"></p>
      <a class="forgot-password-link" id="reset-login-link" href="/admin/nexus">Retour a la connexion</a>
    </section>
  </main>
  <script src="/admin/password-reset.js?v=return-to-login-v1" defer></script>
</body>
</html>
